server:
  port: "${PORT:8080}"
spring:
  main:
    banner-mode: "off"

# Google Cloud configuration for production
google:
  cloud:
    project-id: "${FIRESTORE_PROJECT_ID}"

# Firestore configuration
firestore:
  enabled: true

# Recipe cache configuration  
recipe:
  store:
    enabled: true

# Cookbook configuration for GCP
cookbook:
  gemini:
    api-key: "${COOKBOOK_GEMINI_API_KEY}"
  google:
    #TODO: remove later defaults after setting env variables in deployment
    oauth-id: "${COOKBOOK_GOOGLE_OAUTH_ID:REMOVE_LATER}"
    oauth-secret: "${COOKBOOK_GOOGLE_OAUTH_SECRET:REMOVE_LATER}"

  # Cloud Tasks configuration (YouTube recipe processing)
  tasks:
    enabled: true
    service-url: "${COOKBOOK_TASKS_SERVICE_URL}"
    queue-name: "${COOKBOOK_TASKS_QUEUE_NAME:youtube-recipes}"
    project-id: "${COOKBOOK_TASKS_PROJECT_ID}"
    location: "${COOKBOOK_TASKS_LOCATION:us-west1}"

  # Transcript API configuration
  transcript:
    youtube-transcript-io:
      api-key: "${COOKBOOK_YOUTUBE_TRANSCRIPT_IO_API_KEY}"
    supadata:
      api-key: "${COOKBOOK_SUPADATA_API_KEY}"

  # YouTube Data API configuration
  youtube:
    api-key: "${COOKBOOK_YOUTUBE_API_KEY}"

# TODO: Re-enable Stackdriver metrics for Cloud Run monitoring
# management:
#   metrics:
#     export:
#       stackdriver:
#         enabled: true
#         project-id: "${FIRESTORE_PROJECT_ID}"
#         step: 1m

# Logging configuration for GCP
logging:
  level:
    net.shamansoft.cookbook: INFO
    com.google.cloud: WARN
    root: INFO